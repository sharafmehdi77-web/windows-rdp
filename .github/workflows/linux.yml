name: Ubuntu SSH

on:
  workflow_dispatch:

jobs:
  ubuntu-ssh:
    name: Ubuntu SSH via Tailscale
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Create User
        env:
          LINUX_PASSWORD: ${{ secrets.LINUX_PASSWORD }}
        run: |
          set -e

          if ! id syedsharafmehdi >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash syedsharafmehdi
          fi

          echo "syedsharafmehdi:${LINUX_PASSWORD}" | sudo chpasswd

          sudo usermod -aG sudo syedsharafmehdi

      - name: Configure Passwordless sudo
        run: |
          echo "syedsharafmehdi ALL=(ALL) NOPASSWD:ALL" | \
            sudo tee /etc/sudoers.d/syedsharafmehdi >/dev/null

          sudo chmod 440 /etc/sudoers.d/syedsharafmehdi

          sudo visudo -cf /etc/sudoers.d/syedsharafmehdi

      - name: Install OpenSSH Server
        run: |
          sudo apt-get update

          sudo apt-get install -y openssh-server

          sudo systemctl enable ssh

          sudo systemctl restart ssh

      - name: Configure SSH
        run: |
          sudo sed -i 's/^#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config

          sudo systemctl restart ssh

      - name: Install Tailscale 1.82.0
        run: |
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/jammy.noarmor.gpg \
            | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null

          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/jammy.tailscale-keyring.list \
            | sudo tee /etc/apt/sources.list.d/tailscale.list

          sudo apt-get update

          sudo apt-get install -y tailscale=1.82.0

      - name: Start Tailscale
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          sudo systemctl enable tailscaled

          sudo systemctl start tailscaled

          sudo tailscale up \
            --authkey="${TS_AUTH_KEY}" \
            --hostname="gh-runner-${GITHUB_RUN_ID}" \
            --accept-routes \
            --reset

          for i in {1..20}; do

            TS_IP=$(tailscale ip -4 2>/dev/null | head -1)

            if [ -n "$TS_IP" ]; then
              echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"
              exit 0
            fi

            sleep 3
          done

          echo "Unable to obtain Tailscale IP"

          exit 1

      - name: Verify SSH
        run: |
          sudo systemctl status ssh --no-pager

          ss -tln

          sudo tailscale status

      - name: Connection Information
        run: |
          echo ""
          echo "==================================="
          echo " Ubuntu SSH Ready"
          echo "==================================="
          echo "Host     : $TAILSCALE_IP"
          echo "Port     : 22"
          echo "Username : syedsharafmehdi"
          echo "Password : ${{ secrets.LINUX_PASSWORD }}"
          echo "==================================="

      - name: Keep Runner Alive
        run: |
          while true
          do
            echo "[$(date)] Runner alive."
            sleep 300
          done
