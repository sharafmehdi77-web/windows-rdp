name: Windows RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    name: Windows RDP via Tailscale
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Remote Desktop
        shell: powershell
        run: |
          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Keep NLA disabled (requested)
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          # Configure firewall
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service TermService -Force

      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $username = "syedsharafmehdi"
          $password = $env:RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($password)) {
              throw "Repository secret 'RDP_PASSWORD' is missing."
          }

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name $username
          }

          New-LocalUser `
              -Name $username `
              -Password $securePass `
              -AccountNeverExpires `
              -PasswordNeverExpires

          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username

          "RDP_USERNAME=$username" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RDP_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Tailscale 1.82.0
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait

          Remove-Item $installer -Force

      - name: Connect to Tailscale
        shell: powershell
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTH_KEY)) {
              throw "Repository secret 'TAILSCALE_AUTH_KEY' is missing."
          }

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=$env:TS_AUTH_KEY `
            --hostname=gh-runner-$env:GITHUB_RUN_ID `
            --accept-routes `
            --reset

          $tsIP = $null

          for ($i = 0; $i -lt 12; $i++) {
              try {
                  $tsIP = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 | Select-Object -First 1).Trim()
              } catch {}

              if ($tsIP) {
                  break
              }

              Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
              throw "Failed to obtain a Tailscale IPv4 address."
          }

          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify RDP
        shell: powershell
        run: |
          $svc = Get-Service TermService

          if ($svc.Status -ne "Running") {
              Start-Service TermService
          }

          Write-Host "Hostname:"
          hostname

          Write-Host ""
          Write-Host "Tailscale Status:"
          & "$env:ProgramFiles\Tailscale\tailscale.exe" status

          Write-Host ""
          Write-Host "Assigned IP:"
          Write-Host $env:TAILSCALE_IP

          $test = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          if (-not $test.TcpTestSucceeded) {
              throw "RDP port 3389 is not reachable."
          }

          Write-Host ""
          Write-Host "RDP is reachable."

      - name: Connection Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host " Windows RDP is Ready"
          Write-Host "========================================"
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "========================================"

      - name: Keep Runner Alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Runner alive."
              Wait-Event -Timeout 300 | Out-Null
          }
